<!-- Fiscalidade mark - the néon F, empresadb house style (mask + blue->cyan gradient + signature
     cut), on a dark plate so it stays visible on a light browser tab. Regenerate the raster
     favicon/apple-icon with: node make-icons.mjs -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Fiscalidade">
  <defs>
    <linearGradient id="g" x1="6" y1="26" x2="28" y2="6" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1E88FF"/><stop offset="1" stop-color="#00C6D7"/>
    </linearGradient>
    <mask id="m">
      <rect fill="#fff" x="6" y="6.5" width="4" height="19"/>
      <rect fill="#fff" x="6" y="6.5" width="15" height="4"/>
      <rect fill="#fff" x="6" y="14" width="11" height="4"/>
      <rect fill="#fff" x="22" y="6.5" width="3.5" height="13"/>
      <rect fill="#fff" x="22" y="22.5" width="3.5" height="3"/>
      <rect fill="#000" x="22" y="12.25" width="3.5" height="1.75" rx="0.4"/>
      <path fill="#000" d="M8 25.5 L23 6.5 H25.5 L10.5 25.5 Z" opacity="0.18"/>
    </mask>
  </defs>
  <rect width="32" height="32" rx="6" fill="#0A0F16"/>
  <rect width="32" height="32" fill="url(#g)" mask="url(#m)"/>
</svg>
